<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MOVEQUEST | Login</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<!-- Splash Screen -->
<div class="splash-screen" id="splashScreen">
    <div class="splash-logo">
        <img src="images/logo.png" alt="MOVEQUEST">
        <h2>MOVEQUEST</h2>
    </div>
    <div class="splash-spinner"></div>
    <p class="splash-text">Loading your experience...</p>
</div>

<div class="auth-container">

<div class="auth-left">

<img src="images/login-illustration.png" alt="MOVEQUEST">

<h1>Welcome Back!</h1>

<p>

Continue your dance learning journey through MOVEQUEST.

Improve your skills with interactive lessons, quizzes,

guided practice, and progress tracking.

</p>

</div>

<div class="auth-right">

<form class="auth-card" id="loginForm">

<h2>Login</h2>

<p class="subtitle">

Sign in to continue learning.

</p>

<input type="email" id="loginEmail" placeholder="Email Address" required>

<input type="password" id="loginPassword" placeholder="Password" required>

<button type="submit" id="loginBtn">

Login

</button>

<p>

Don't have an account?

<a href="register.html">

Register Here

</a>

</p>

</form>

</div>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>
<script src="auth.js"></script>

<script>
// Check auth state with splash
auth.onAuthStateChanged((user) => {
    if (user) {
        window.location.href = "dashboard.html";
    } else {
        document.getElementById("splashScreen").classList.add("hidden");
    }
});
</script>

<script>
const loginForm = document.getElementById("loginForm");
loginForm.addEventListener("submit", function(e) {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;
    const btn = document.getElementById("loginBtn");
    btn.textContent = "Logging in...";
    btn.disabled = true;

    loginUser(email, password)
        .then(() => { window.location.href = "dashboard.html"; })
        .catch((error) => {
            alert(error.message);
            btn.textContent = "Login";
            btn.disabled = false;
        });
});
</script>

</body>

</html>
