<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MOVEQUEST | Register</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="auth-container">

<div class="auth-left">

<img src="images/register-illustration.png" alt="MOVEQUEST">

<h1>Join MOVEQUEST</h1>

<p>

Create your account and begin improving your dance skills through structured lessons, guided practice, interactive quizzes, and progress tracking.

</p>

</div>

<div class="auth-right">

<form class="auth-card">

<h2>Create Account</h2>

<p class="subtitle">

Register to start your learning journey.

</p>

<input type="text" placeholder="Full Name" required>

<input type="email" placeholder="Email Address" required>

<input type="text" placeholder="Student ID" required>

<input type="password" placeholder="Password" required>

<input type="password" placeholder="Confirm Password" required>

<button type="submit">

Create Account

</button>

<p>

Already have an account?

<a href="login.html">

Login Here

</a>

</p>

</form>

</div>

</div>

</body>

</html>
